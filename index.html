<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 의존도 조사</title><meta name="description" content="학생의 AI 활용 및 의존도 조사"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b4868'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><main>
<section id="survey" class="screen" aria-labelledby="survey-title"><div class="survey-wrap"><header class="brand"><span class="brand-icon" aria-hidden="true">a.</span> AI USAGE SURVEY</header><div class="survey-card"><p class="eyebrow">학생 AI 활용 설문</p><h1 id="survey-title" tabindex="-1">AI 의존도 조사</h1><p class="description">일상과 학습 속 AI 활용에 관한 조사입니다.<br>시작하기 전에 아래 정보를 입력해주세요.</p><div class="divider"></div><form id="survey-form"><label for="school">학교</label><input id="school" name="school" placeholder="학교를 입력하세요" autocomplete="organization" maxlength="80" required><label for="participant-name">이름 (실명)</label><input id="participant-name" name="participantName" placeholder="이름을 입력하세요" autocomplete="name" maxlength="40" required><button type="submit" class="primary">다음으로 <span aria-hidden="true">→</span></button><p class="privacy">이 단계에서는 입력한 정보를 전송하지 않습니다.</p></form></div><footer>AI USAGE & DEPENDENCY</footer></div></section>
<section id="birthday" class="screen celebration" hidden aria-labelledby="birthday-title"><div class="birthday-wrap"><p class="eyebrow">서프라이즈!</p><div class="cake" aria-hidden="true">🎂</div><h1 id="birthday-title" tabindex="-1"><span id="recipient-name"></span>의 생일을<br>축하합니다!</h1><p class="description">오늘 맛있는 거 먹고 즐겁게 보내!<br>선물도 하나 준비했어.</p><button id="to-gifts" class="primary">다음으로 <span aria-hidden="true">→</span></button></div></section>
<section id="gifts" class="screen celebration" hidden aria-labelledby="gifts-title"><div class="gift-wrap"><h1 id="gifts-title" tabindex="-1">작은 생일 선물</h1><p class="description">마음에 드는 걸 딱 하나만 골라줘</p><form id="gift-form"><fieldset><legend class="sr-only">생일 선물 선택</legend><div class="gift-grid"><label class="gift-card"><input type="radio" name="gift" value="편의점 상품권 1만원" required><span class="gift-emoji" aria-hidden="true">🏪</span><strong>편의점 상품권</strong><span class="gift-detail">1만원</span></label><label class="gift-card"><input type="radio" name="gift" value="적당히 먹을거"><span class="gift-emoji" aria-hidden="true">🍪</span><strong>적당히 먹을거</strong><span class="gift-detail">맛있는 걸로</span></label><label class="gift-card"><input type="radio" name="gift" value="손편지"><span class="gift-emoji" aria-hidden="true">✉️</span><strong>손편지</strong><span class="gift-detail">직접 쓴 마음</span></label><label class="gift-card"><input type="radio" name="gift" value="김아준의 아이템"><span class="gift-emoji" aria-hidden="true">📦</span><strong>김아준의 아이템</strong><span class="gift-detail">뭐가 나올지는 비밀</span></label></div></fieldset><p id="send-status" class="send-status" role="status" aria-live="polite"></p><button id="choose-gift" class="primary" type="submit" disabled>선물을 골라주세요</button></form><button id="back-birthday" class="text-button">이전으로</button></div></section>
<section id="result" class="screen celebration" hidden aria-labelledby="selected-gift"><div class="result-wrap"><p class="eyebrow">접수 완료</p><div id="result-emoji" class="cake" aria-hidden="true"></div><h1 id="selected-gift" class="selected-gift" tabindex="-1"></h1><p class="description">선택 내용이 접수됐어.<br>김아준이 확인하고 준비할게!</p><p class="signature">다시 한 번, 생일 축하해.</p></div></section>
</main><audio id="birthday-audio" src="birthday.mp3" preload="metadata"></audio><button id="music-toggle" class="music-toggle" type="button" hidden aria-label="생일 축하 노래 재생">♪ 노래 듣기</button><canvas id="confetti" aria-hidden="true"></canvas></body></html>
